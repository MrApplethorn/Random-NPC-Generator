<!DOCTYPE html>
<html>
  <head>
    <title>Towncrier</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="https://mrapplethorn.github.io/Oracle/styles.css">
  </head>
  
  <body>
    <div class="container">
      <h1>Towncrier</h1>
      <p class="intro-text">Did your player characters just start talking to a random NPC but you have no idea who that person is, click the "Generate NPC"-button below.</p>
      <div class="reel-wrapper">
        <div class="reels">
          <!-- This stays empty, JavaScript fills it -->
        </div>
      </div>
      <button id="generateButton">Generate NPC</button>
      <hr class="section-divider">
      <p><a href="https://mrapplethorn.github.io/Oracle/">Oracle</a> • <a href="https://mrapplethorn.github.io/Widowmaker/">Widowmaker</a></p>
    </div>
    
    <script src="dataset.js"></script>

    <script>
      const generateButton = document.getElementById("generateButton");
      let finalResults = {};
      
      function buildReel(innerEl, datasets, spinDuration, hasOverlay) {
        const SPIN_COUNT = 30;
        const items = [];
        
        for (let i = 0; i < SPIN_COUNT; i++) {
          const values = datasets.map(dataset => {
            const item = dataset[Math.floor(Math.random() * dataset.length)];
            return typeof item === 'object' && item.name ? item.name : item;
          });
          items.push(values.join(', '));
        }
        
        const finalObjects = datasets.map(dataset =>
          dataset[Math.floor(Math.random() * dataset.length)]
        );
        const finalValues = finalObjects.map(item =>
          typeof item === 'object' && item.name ? item.name : item
        );
        const finalItem = finalValues.join(', ');
        items.push(finalItem);
      
        innerEl.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = item;
          innerEl.appendChild(div);
        });
      
        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
      
        const targetY = -(SPIN_COUNT * 80);
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${targetY}px)`;
      
        return hasOverlay ? { display: finalItem, objects: finalObjects } : null;
      }
      
      function spinReels() {
        generateButton.disabled = true;
        finalResults = {};
      
        // Spin each reel based on config
        Object.entries(reelConfig).forEach(([key, config]) => {
          const innerEl = document.getElementById(`inner-${key}`);
          
          if (config.buildFunction) {
            const result = config.buildFunction(innerEl, config.datasets, config.spinDuration);
            if (result) {
              finalResults[key] = result;
            }
          } else {
            const finalItem = buildReel(innerEl, config.datasets, config.spinDuration, config.hasOverlay);
            if (finalItem) {
              finalResults[key] = finalItem;
            }
          }
        });
      
        setTimeout(() => {
          Object.entries(reelConfig).forEach(([key, config]) => {
            if (config.hasOverlay && finalResults[key]) {
              const descriptions = finalResults[key].objects
                .filter(obj => obj.description)
                .map(obj => obj.description)
                .join(' ');
              document.getElementById(`${key}-description`).textContent = descriptions;
            }
          });
          generateButton.disabled = false;
        }, 3100);
      } // <-- This closing brace was missing!

      function initializeReels() {
        const reelsContainer = document.querySelector('.reels');
        reelsContainer.innerHTML = '';
        
        Object.entries(reelConfig).forEach(([key, config]) => {
          // Create wrapper for label + reel
          const wrapper = document.createElement('div');
          wrapper.className = `reel-wrapper-item${config.isWide ? ' wide' : ''}`;
          
          // Create label if it exists
          if (config.label) {
            const label = document.createElement('div');
            label.className = 'reel-label';
            label.textContent = config.label;
            wrapper.appendChild(label);
          }
          
          const reelOuter = document.createElement('div');
          reelOuter.className = 'reel-outer';
          reelOuter.id = `reel-${key}`;
          
          const reelInner = document.createElement('div');
          reelInner.className = 'reel-inner';
          reelInner.id = `inner-${key}`;
          
          reelOuter.appendChild(reelInner);
          
          if (config.hasOverlay) {
            const overlay = document.createElement('div');
            overlay.className = 'overlay-panel';
            overlay.id = `${key}-details-overlay`;
            
            const description = document.createElement('div');
            description.id = `${key}-description`;
            
            overlay.appendChild(description);
            reelOuter.appendChild(overlay);
            
            reelOuter.addEventListener('click', () => {
              overlay.classList.toggle('active');
            });
          }
          
          wrapper.appendChild(reelOuter);
          reelsContainer.appendChild(wrapper);
        });
      }
      
      // Call this on page load
      initializeReels();
      
      generateButton.addEventListener("click", spinReels);
    </script>
  </body>
</html>
