<!DOCTYPE html>
<html>
  <head>
    <title>Towncrier</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="https://mrapplethorn.github.io/Oracle/styles.css">
  </head>
  
  <body>
    <div class="container">
      <h1>Towncrier</h1>
      <p class="intro-text">Did your player characters just start talking to a random NPC but you have no idea who that person is, click the "Generate NPC"-button below.</p>
      <div class="reel-wrapper">
        <div class="reels">
          <div class="reel-outer wide" id="reel-race">
            <div class="reel-inner" id="inner-race"></div>
            <div class="overlay-panel" id="race-details-overlay">
              <div id="race-description"></div>
            </div>
          </div>
          <div class="reel-outer" id="reel-keyword">
            <div class="reel-inner" id="inner-keyword"></div>
          </div>
          <div class="reel-outer" id="reel-trait">
            <div class="reel-inner" id="inner-trait"></div>
          </div>
          <div class="reel-outer wide" id="reel-personal">
            <div class="reel-inner" id="inner-personal"></div>
          </div>
          <div class="reel-outer wide" id="reel-alignment">
            <div class="reel-inner" id="inner-alignment"></div>
            <div class="overlay-panel" id="alignment-details-overlay">
              <div id="alignment-description"></div>
            </div>
          </div>
        </div>
      </div>
      <button id="generateButton">Generate NPC</button>
      <hr class="section-divider">
      <p><a href="https://mrapplethorn.github.io/Oracle/">Oracle</a> • <a href="https://mrapplethorn.github.io/Widowmaker/">Widowmaker</a></p>
    </div>
    
    <script src="dataset.js"></script>

    <script>
      const generateButton = document.getElementById("generateButton");
      let finalRaceIndex = 0;

      function buildReel(innerEl, list, spinDuration) {
        const SPIN_COUNT = 30;
        const items = [];
        
        for (let i = 0; i < SPIN_COUNT; i++) {
          items.push(list[Math.floor(Math.random() * list.length)]);
        }
        items.push(list[Math.floor(Math.random() * list.length)]);
      
        innerEl.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          if (typeof item === 'object' && item.name) {
            div.textContent = item.name;
          } else {
            div.textContent = item;
          }
          innerEl.appendChild(div);
        });
      
        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
      
        const targetY = -(SPIN_COUNT * 80);
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${targetY}px)`;
      }
      
      function buildCombinationReel(innerEl, finalSexuality, finalGender, finalRelationship, spinDuration) {
        const combinations = [];
        const SPIN_COUNT = 30;
      
        for (let i = 0; i < SPIN_COUNT; i++) {
          const g = gender[Math.floor(Math.random() * gender.length)];
          const validSexualities = getValidSexuality(g);
          const s = validSexualities[Math.floor(Math.random() * validSexualities.length)];
          const r = relationship[Math.floor(Math.random() * relationship.length)];
          const formattedDisplay = formatSexualityAndGender(s, g);
          combinations.push(`${formattedDisplay}, ${r}`);
        }
        
        const formattedFinalDisplay = formatSexualityAndGender(finalSexuality, finalGender);
        combinations.push(`${formattedFinalDisplay}, ${finalRelationship}`);
      
        innerEl.innerHTML = '';
        combinations.forEach(text => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = text;
          innerEl.appendChild(div);
        });
      
        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
      
        const targetY = -(SPIN_COUNT * 80);
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${targetY}px)`;
      }

      function spinReels() {
        generateButton.disabled = true;
      
        const finalTraitIndex = Math.floor(Math.random() * traits.length);
        const finalKeywordIndex = Math.floor(Math.random() * keywords.length);
        const finalGenderIndex = Math.floor(Math.random() * gender.length);
        const finalGender = gender[finalGenderIndex];
        const validSexualities = getValidSexuality(finalGender);
        const finalSexualityIndex = Math.floor(Math.random() * validSexualities.length);
        const finalSexuality = validSexualities[finalSexualityIndex];
        const finalRelationshipIndex = Math.floor(Math.random() * relationship.length);
        finalRaceIndex = Math.floor(Math.random() * race.length);
        const finalAlignmentIndex = Math.floor(Math.random() * alignment.length);
      
        buildReel(document.getElementById('inner-race'), race, 1800);
        buildReel(document.getElementById('inner-keyword'), keywords, 2000);
        buildReel(document.getElementById('inner-trait'), traits, 2200);
        buildCombinationReel(document.getElementById('inner-personal'), finalSexuality, finalGender, relationship[finalRelationshipIndex], 2400);
        buildReel(document.getElementById('inner-alignment'), alignment, 2600);
      
        setTimeout(() => {
          document.getElementById('race-description').textContent = race[finalRaceIndex].description;
          document.getElementById('alignment-description').textContent = alignment[finalAlignmentIndex].description;
        }, 3100);
      
        setTimeout(() => {
          generateButton.disabled = false;
        }, 3100);
      }
      
      // Toggle overlay on race reel click
      document.getElementById('reel-race').addEventListener('click', () => {
        const overlay = document.getElementById('race-details-overlay');
        overlay.classList.toggle('active');
      });
      
      // Toggle overlay on alignment reel click
      document.getElementById('reel-alignment').addEventListener('click', () => {
        const overlay = document.getElementById('alignment-details-overlay');
        overlay.classList.toggle('active');
      });
      
      generateButton.addEventListener("click", spinReels);
    </script>
  </body>
</html>
