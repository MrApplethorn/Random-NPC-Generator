<!DOCTYPE html>
<html>
  <head>
    <title>Towncrier</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="stylesheet" href="https://mrapplethorn.github.io/Oracle/styles.css">
  </head>
  
  <body>
    <div class="container">
      <h1>Towncrier</h1>
      <p class="intro-text">Did your player characters just start talking to a random NPC but you have no idea who that person is, click the "Generate NPC"-button below.</p>
      <div class="reel-wrapper">
        <div class="reels">
          <div class="reel-outer wide" id="reel-race">
            <div class="reel-inner" id="inner-race"></div>
            <div class="overlay-panel" id="race-details-overlay">
              <div id="race-description"></div>
            </div>
          </div>
          <div class="reel-outer" id="reel-keyword">
            <div class="reel-inner" id="inner-keyword"></div>
          </div>
          <div class="reel-outer" id="reel-trait">
            <div class="reel-inner" id="inner-trait"></div>
          </div>
          <div class="reel-outer wide" id="reel-personal">
            <div class="reel-inner" id="inner-personal"></div>
          </div>
          <div class="reel-outer wide" id="reel-alignment">
            <div class="reel-inner" id="inner-alignment"></div>
            <div class="overlay-panel" id="alignment-details-overlay">
              <div id="alignment-description"></div>
            </div>
          </div>
        </div>
      </div>
      <button id="generateButton">Generate NPC</button>
      <hr class="section-divider">
      <p><a href="https://mrapplethorn.github.io/Oracle/">Oracle</a> • <a href="https://mrapplethorn.github.io/Widowmaker/">Widowmaker</a></p>
    </div>
    
    <script src="dataset.js"></script>

    <script>
      const generateButton = document.getElementById("generateButton");
      let finalResults = {};
      
      function buildReel(innerEl, datasets, spinDuration, hasOverlay) {
        const SPIN_COUNT = 30;
        const combined = combineDatasets(datasets);
        const items = [];
        
        for (let i = 0; i < SPIN_COUNT; i++) {
          const values = datasets.map(dataset => 
            dataset[Math.floor(Math.random() * dataset.length)]
          );
          items.push(values.join(', '));
        }
        
        const finalValues = datasets.map(dataset =>
          dataset[Math.floor(Math.random() * dataset.length)]
        );
        const finalItem = finalValues.join(', ');
        items.push(finalItem);
      
        innerEl.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'reel-item';
          div.textContent = item;
          innerEl.appendChild(div);
        });
      
        innerEl.style.transition = 'none';
        innerEl.style.transform = 'translateY(0)';
        innerEl.getBoundingClientRect();
      
        const targetY = -(SPIN_COUNT * 80);
        innerEl.style.transition = `transform ${spinDuration}ms cubic-bezier(0.25, 0.1, 0.2, 1)`;
        innerEl.style.transform = `translateY(${targetY}px)`;
      
        return hasOverlay ? finalItem : null;
      }
      
      function spinReels() {
        generateButton.disabled = true;
        finalResults = {};
      
        // Spin each reel based on config
        Object.entries(reelConfig).forEach(([key, config]) => {
          const innerEl = document.getElementById(`inner-${key}`);
          
          if (config.buildFunction) {
            const result = config.buildFunction(innerEl, config.datasets, config.spinDuration);
            if (result) {
              finalResults[key] = result;
            }
          } else {
            const finalItem = buildReel(innerEl, config.datasets, config.spinDuration, config.hasOverlay);
            if (finalItem) {
              finalResults[key] = finalItem;
            }
          }
        });
      
        setTimeout(() => {
          if (reelConfig.race.hasOverlay && finalResults.race) {
            document.getElementById('race-description').textContent = finalResults.race.description;
          }
          if (reelConfig.alignment.hasOverlay && finalResults.alignment) {
            document.getElementById('alignment-description').textContent = finalResults.alignment.description;
          }
          generateButton.disabled = false;
        }, 3100);
      } // <-- This was missing!
      
      // Toggle overlays
      document.getElementById('reel-race').addEventListener('click', () => {
        document.getElementById('race-details-overlay').classList.toggle('active');
      });
      
      document.getElementById('reel-alignment').addEventListener('click', () => {
        document.getElementById('alignment-details-overlay').classList.toggle('active');
      });
      
      generateButton.addEventListener("click", spinReels);
    </script>
  </body>
</html>
